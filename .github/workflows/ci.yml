name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Prometheus config and rules
        run: |
          docker run --rm -v "$PWD/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v2.55.0 check config prometheus.yml

      - name: Unit test alert rules
        run: |
          docker run --rm -v "$PWD/prometheus:/p" -w /p --entrypoint promtool prom/prometheus:v2.55.0 test rules tests/alerts_test.yml

      - name: Check Alertmanager config
        run: |
          docker run --rm -v "$PWD/alertmanager:/a" --entrypoint amtool prom/alertmanager:v0.27.0 check-config /a/alertmanager.yml

      - name: Check dashboards are valid JSON
        run: for f in grafana/dashboards/*.json; do jq empty "$f"; done

      - name: Check compose file
        run: docker compose config --quiet

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test demo app
        working-directory: demo-app
        run: |
          pip install -r requirements.txt pytest==8.4.2 ruff==0.17.2
          ruff check .
          ruff format --check .
          pytest -v

  integration:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for every Prometheus target to be up
        run: |
          for i in $(seq 1 30); do
            down=$(curl -fs localhost:9090/api/v1/targets | jq '[.data.activeTargets[] | select(.health != "up")] | length' || echo -1)
            [ "$down" = "0" ] && echo "all targets up" && exit 0
            sleep 5
          done
          curl -s localhost:9090/api/v1/targets | jq '.data.activeTargets[] | {job: .labels.job, health, lastError}'
          exit 1

      - name: Check Grafana loaded the dashboard and datasources
        run: |
          curl -fs -u admin:admin localhost:3000/api/health
          curl -fs -u admin:admin localhost:3000/api/dashboards/uid/service-overview | jq -e '.dashboard.title == "Service Overview"'
          curl -fs -u admin:admin localhost:3000/api/datasources | jq -e 'length == 3'

      - name: Check logs reach Loki
        run: |
          for i in $(seq 1 30); do
            n=$(curl -fsG localhost:3100/loki/api/v1/query_range --data-urlencode 'query={service="demo-app"}' | jq '.data.result | length' || echo 0)
            [ "$n" -gt 0 ] && echo "demo-app logs found in Loki" && exit 0
            sleep 5
          done
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --tail 50

      - name: Stop the stack
        if: always()
        run: docker compose down -v
